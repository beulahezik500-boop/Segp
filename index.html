<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SEGP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1e6fe0">
<style>
:root{--bg:#e8f6ff;--card:#fff;--tx:#12304a;--pr:#1e6fe0;--gr:#1fa65a;--or:#f59e0b;--rd:#e0453a;--pu:#7c4ddb;--mu:#5d7790;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1b2a;--card:#16283b;--tx:#eaf3fb;--mu:#9bb4c8}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.badge{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:var(--gr)}.badge.off{background:var(--rd)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:8px 0;box-shadow:0 2px 0 rgba(0,0,0,.08)}
h1,h2,h3{margin:6px 0}h1{font-size:26px}
.btn,.opt{display:block;width:100%;border:0;border-radius:14px;padding:13px;margin:8px 0;font-size:16px;font-weight:700;color:#fff;background:var(--pr);box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
.btn.g{background:var(--gr)}.btn.p{background:var(--pu)}.btn.o{background:var(--or)}.btn.r{background:var(--rd)}.btn.s{width:auto;display:inline-block;padding:8px 12px;font-size:13px;margin:2px}.btn:disabled{opacity:.5}
.opt{background:var(--card);color:var(--tx);border:2px solid var(--pr);text-align:left}
.opt.ok{background:var(--gr);color:#fff}.opt.no{background:var(--rd);color:#fff}.opt.sel{outline:3px solid var(--or)}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sub .btn{height:84px;margin:0}
.lv{display:flex;align-items:center;gap:10px}.lv .n{font-size:28px;font-weight:800;width:44px;text-align:center}.lv .i{flex:1}.lv small{color:var(--mu)}
.lock{opacity:.55}.bar{height:14px;background:#0002;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.f{padding:10px;border-radius:12px;margin:8px 0;font-weight:600}.f.g{background:#1fa65a33}.f.b{background:#e0453a33}
input{width:100%;padding:11px;border-radius:10px;border:2px solid #8aa;font-size:16px;background:var(--card);color:var(--tx);margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mem{height:72px;font-size:13px;padding:4px;margin:0;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .opt{margin:4px 0;font-size:14px}
.big{text-align:center;font-size:56px}.pop{animation:pop .6s}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:6px;border-bottom:1px solid #8884;text-align:left}select,textarea{width:100%;padding:11px;border-radius:10px;border:2px solid #8aa;font-size:16px;background:var(--card);color:var(--tx);margin:4px 0}@media print{body{background:#fff}.noprint,.top .btn,.badge{display:none!important}}.rep{background:#fff;color:#111;border:2px solid #123;border-radius:6px;padding:14px}.rep .tbl td,.rep .tbl th{color:#111}@media print{.top{display:none!important}}.note{font-size:13px;color:var(--mu)}.err{color:var(--rd);font-weight:600}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),R=h=>{$('#app').innerHTML=h},cp=o=>JSON.parse(JSON.stringify(o));
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
/* ===== IndexedDB: content, progress, queue of attempts waiting to send ===== */
const memo={};const DB=new Promise(r=>{try{const q=indexedDB.open('segp',2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('kv'))q.result.createObjectStore('kv')};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const kvGet=async k=>{const d=await DB;if(!d)return memo[k];return new Promise(r=>{try{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(memo[k])}catch(e){r(memo[k])}})};
const kvSet=async(k,v)=>{memo[k]=v;const d=await DB;if(!d)return;try{d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}};
let BX={},U=null,CT={levels:[]},DN={},Q=[],RS=[],mute=false,ac,msg='';
const online=()=>navigator.onLine;
async function load(){try{U=JSON.parse(LS.g('user'))}catch(e){U=null}CT=(await kvGet('content'))||{levels:[]};DN=(await kvGet('done'))||{};Q=(await kvGet('q'))||[];RS=(await kvGet('rs'))||[];BX=(await kvGet('box'))||{}}
/* ===== talking to Google Apps Script ===== */
async function api(action,d){const r=await fetch(LS.g('api'),{method:'POST',body:JSON.stringify(Object.assign({action,token:LS.g('token')},d||{}))}),j=await r.json();if(!j.ok)throw new Error(j.error);return j.data}
async function flush(){for(const q of Q.slice()){try{await api('submitAttempt',q);Q=Q.filter(x=>x!==q)}catch(e){if(e instanceof TypeError||/Session/.test(e.message))throw e;Q=Q.filter(x=>x!==q)}}await kvSet('q',Q)}
async function sync(){if(!online()){msg='You are offline. Connect to sync.';return home()}
 try{await flush();CT=await api('getContent');await kvSet('content',CT);RS=await api('myResults');await kvSet('rs',RS);RS.forEach(x=>{if(x.Status=='PASS')DN[x.LevelID]=Math.max(DN[x.LevelID]||0,x.Percentage)});await kvSet('done',DN);LS.s('synced',new Date().toLocaleString());msg='Games downloaded. You can now play without internet.'}
 catch(e){if(/Session/.test(e.message)){LS.d('token');return login('Your session ended. Log in again to sync. Your saved scores are safe on this phone.')}msg=e instanceof TypeError?'Could not reach the server. Try again later.':e.message}
 home()}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
/* ===== screens ===== */
const bar=()=>`<div class=top><b>🎓 SEGP</b><span><button class="btn s o" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">${mute?'🔇':'🔊'}</button> <span class="badge ${online()?'':'off'}">${online()?'Online':'Offline'}</span></span></div>`;
function note(){const m=msg;msg='';return m?`<div class=card><b>${m}</b></div>`:''}
async function boot(){await load();if(!LS.g('api'))return setupApi();if(U&&U.Role!='student')return LS.g('token')?staffHome():login();if(!U||!LS.g('pinh'))return login();pin()}
function setupApi(){R(bar()+`<div class=card><h2>First-time setup</h2><p>Paste the Web App link your teacher or administrator gave you.</p><input id=u placeholder="https://script.google.com/macros/s/.../exec"><button class=btn onclick="const v=$('#u').value.trim();if(!/^https:\\/\\/script\\.google\\.com\\//.test(v))return alert('That does not look like a Google Apps Script link');LS.s('api',v);boot()">Save</button></div>`)}
function login(m){R(bar()+`<div class=card style="text-align:center"><div class=big>📚</div><h1>School Educational Games Portal</h1><p>Play · Learn · Grow</p><p class=err>${m||''}</p><input id=un placeholder=Username autocapitalize=none autocomplete=username><input id=pw type=password placeholder=Password autocomplete=current-password><button class=btn id=lg>Log in</button><p class=note>You need internet to log in the first time. After that, a PIN opens the app offline.</p></div>`);
 $('#lg').onclick=async()=>{$('#lg').disabled=1;try{const r=await api('login',{username:$('#un').value,password:$('#pw').value,token:''});if(r.user.Role!='student'){LS.s('token',r.token);LS.s('user',JSON.stringify(r.user));U=r.user;return staffHome()}
  if(U&&U.UserID!=r.user.UserID){await Promise.all([kvSet('content',null),kvSet('done',{}),kvSet('q',[]),kvSet('rs',[])]);LS.d('pinh')}
  LS.s('token',r.token);LS.s('user',JSON.stringify(r.user));U=r.user;await load();if(LS.g('pinh'))return sync();setPin()}catch(e){login(e instanceof TypeError?'Cannot reach the server. Check internet and the saved link.':e.message)}}}
function setPin(){R(bar()+`<div class=card><h2>Create a 4-digit PIN</h2><p>This PIN opens the app when you have no internet.</p><input id=p1 type=password inputmode=numeric maxlength=4 placeholder="PIN"><button class=btn onclick="mkPin()">Save PIN</button><p class=note>Security note: a PIN protects this phone only. Anyone who knows it and holds the phone can open your offline games.</p></div>`)}
async function mkPin(){const p=$('#p1').value;if(!/^\d{4}$/.test(p))return alert('Use exactly 4 digits');LS.s('pinh',await sha(p+U.UserID));sync()}
function pin(){R(bar()+`<div class=card style="text-align:center"><h2>Welcome back, ${U.FullName.split(' ')[0]}!</h2><input id=p1 type=password inputmode=numeric maxlength=4 placeholder="Enter your PIN"><p class=err id=pe></p><button class=btn id=go>Open</button><button class="btn s" onclick="LS.d('token');login()">Use password instead</button></div>`);
 $('#go').onclick=async()=>{if(await sha($('#p1').value+U.UserID)==LS.g('pinh'))home();else $('#pe').textContent='Wrong PIN'}}
const subs=()=>[...new Map(CT.levels.map(l=>[l.subjectId,l.subject])).entries()];
const lvs=s=>CT.levels.filter(l=>l.subjectId==s).sort((a,b)=>a.levelNo-b.levelNo);
function home(){const n=CT.levels.length,d=CT.levels.filter(l=>DN[l.levelId]!=null).length,pc=n?Math.round(d/n*100):0;
 R(bar()+note()+`<div class=card><h2>Welcome, ${U.FullName}! 👋</h2><div class=note>${CT.school||''}</div></div>`+(subs().length?`<div class=sub>${subs().map(s=>`<button class="btn ${['g','p','o',''][Math.abs(s[0].length)%4]}" onclick="subject('${s[0]}')">${s[1]}</button>`).join('')}</div>`:'<div class=card>No games yet. Tap Sync games while online.</div>')+
 `<div class=card><b>Your progress: ${pc}%</b><div class=bar><i style="width:${pc}%"></i></div><p>Levels completed: <b>${d}</b> of ${n}</p></div>
 <div class=card><b>📴 Offline</b><p class=note>Last sync: ${LS.g('synced')||'never'}. Waiting to send: ${Q.length} attempt(s).</p><button class="btn g" onclick="sync()" ${online()?'':'disabled'}>⬇ Sync games and send scores</button><button class="btn p" onclick="results()">📊 My Results</button><button class="btn o" onclick="revZone()">🧠 My Revision Zone</button><p class=note>Your scores are sent to your school’s records when you are online.</p></div><button class=btn onclick="LS.d('token');LS.d('user');U=null;login()">Log out</button>`)}
function subject(id){const L=lvs(id);R(bar()+`<button class="btn s" onclick="home()">← Back</button><h2>${L[0].subject}</h2>`+L.map((l,i)=>{const ok=i==0||DN[L[i-1].levelId]!=null,dn=DN[l.levelId];return `<div class="card lv ${ok?'':'lock'}"><div class=n>${ok?l.levelNo:'🔒'}</div><div class=i><b>Level ${l.levelNo}: ${l.topic}</b><br><small>${l.game} · ${l.difficulty} · ${dn!=null?'✅ Best '+dn+'%':ok?'Unlocked':'Finish the level before first'}</small></div>${ok?`<button class="btn s ${dn!=null?'g':''}" onclick="start('${l.levelId}')">${dn!=null?'Replay':'Play'}</button>`:''}</div>`}).join(''))}
const mm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function results(){const P=Q.map(q=>`<div class=card><b>${q.topic}</b><br>${q.pct}% · ⏳ Waiting to send<br><small>${q.when}</small></div>`).join(''),best={},bs={};
 RS.forEach(x=>{best[x.Topic]=Math.max(best[x.Topic]||0,x.Percentage);(bs[x.Subject]=bs[x.Subject]||[]).push(Number(x.Percentage))});
 const A=RS.slice().reverse().map(x=>`<div class=card onclick="report('${x.ScoreID}')" style="cursor:pointer"><b>${x.Topic} (Level ${x.Level})</b><br>${x.Percentage}% · ${x.Status=='PASS'?'✅ Passed':'❌ Failed'} · attempt ${x.AttemptNo}<br><small>${String(x.CompletedAt).slice(0,16).replace('T',' ')} · tap for report</small></div>`).join('');
 R(bar()+`<button class="btn s" onclick="home()">← Back</button><h2>📊 My Results</h2>`+(RS.length?`<div class=card><b>Average by subject</b>${Object.keys(bs).map(k=>`<br>${k}: ${Math.round(bs[k].reduce((a,b)=>a+b,0)/bs[k].length)}%`).join('')}<br><b>Best score per game</b>${Object.keys(best).map(k=>`<br>${k}: ${best[k]}%`).join('')}</div>`:'')+P+A+(RS.length?`<button class="btn o" onclick="report('all')">Subject report: all attempts</button>`:'<div class=card>Play a level to see results.</div>'))}
function report(id){const L=id=='all'?RS:RS.filter(x=>x.ScoreID==id);
 R(`<div class=noprint><button class="btn s" onclick="results()">← Back</button><button class=btn onclick="print()">🖨 Print Result</button><button class="btn g" onclick="pdf('${id}')">⬇ Download PDF</button></div><div class=rep><h3 style="text-align:center;margin:2px">${(CT.school||'').toUpperCase()}</h3><h2 style="text-align:center;margin:2px">STUDENT GAME PERFORMANCE REPORT</h2><p>Student: <b>${U.FullName}</b> · ID: ${U.AdmissionNo||U.UserID} · Class: ${L[0]?L[0].Class:''}</p><div style="overflow-x:auto"><table class=tbl><tr>${['Subject','Topic','Level','Game','Date','Questions','Correct','Wrong','Score','%','Status','Time'].map(h=>`<th>${h}</th>`).join('')}</tr>${L.map(x=>`<tr>${[x.Subject,x.Topic,x.Level,x.GameTitle,String(x.CompletedAt).slice(0,16).replace('T',' '),x.TotalQuestions,x.Correct,x.Wrong,x.Score+'/'+x.MaxScore,x.Percentage+'%',x.Status,mm(Number(x.TimeSpentSec)||0)].map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div></div>`)}
async function pdf(id){if(!online())return alert('PDF needs internet. Use Print now, or try again when online.');try{const r=await api('reportPdf',{scoreId:id}),b=atob(r.base64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download=r.filename;document.body.appendChild(a);a.click();a.remove()}catch(e){alert(e.message)}}
/* ===== game engine ===== */
const good=['Great job! 🎉','Brilliant! ⭐','Well done! 👏','Correct! 💪'],bad=['Not quite. Keep going! 💡','Oops! You will get the next one. 🌱'],pk=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),norm=s=>String(s==null?'':s).trim().toLowerCase();
const snd=ok=>{if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=ok?740:200;o.connect(g);g.connect(ac.destination);g.gain.value=.08;o.start();o.stop(ac.currentTime+.15)}catch(e){}};
const GM=h=>{$('#gm').innerHTML=h};
function fb(ok,e,next){snd(ok);$('#fb').innerHTML=`<div class="f ${ok?'g':'b'}">${pk(ok?good:bad)} ${e||''}</div><button class=btn id=nx>Next ➜</button>`;$('#nx').onclick=next}
function seq(d,e,show){let i=0,c=0,A=[];const st=()=>{if(i>=d.length)return e(c,d.length,A);const q=d[i];show(q,i,(a,ok,x)=>{A[q.k!==undefined?q.k:i]=a;if(ok)c++;fb(ok,x,()=>{i++;st()})})};st()}
const quizG=o=>(d,e)=>{let tm;seq(d,(c,t,A)=>{clearInterval(tm);e(c,t,A)},(q,i,done)=>{clearInterval(tm);const pth=o.path?`<div class=note>🗺️ ${d.map((_,k)=>k<i?'🟩':k==i?'🧒':'⬜').join('')} 🏁</div>`:'';
 const fin=k=>{clearInterval(tm);const B=document.querySelectorAll('.opt');B.forEach(x=>x.onclick=null);B[q.a].classList.add('ok');if(k>=0&&k!=q.a)B[k].classList.add('no');done(k,k==q.a,q.e)};
 const show=()=>{GM(pth+`<div class=note>Question ${i+1} of ${d.length}${o.t?` · ⏱ <b id=tmr>${o.t}</b>s`:''}</div><div class=card><b>${q.q}</b></div>`+q.o.map(x=>`<button class=opt>${x}</button>`).join('')+'<div id=fb></div>');document.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>fin(k));if(o.t){let s=o.t;tm=setInterval(()=>{s--;const t=$('#tmr');if(t)t.textContent=s;if(s<=0)fin(-1)},1000)}};
 if(o.think){GM(pth+`<div class=card><b>${q.q}</b></div><p class=note>🧠 Think of your answer first. Then reveal the options.</p><button class=btn id=rv>I have an answer: show options</button>`);$('#rv').onclick=show}else show()})};
const typed=(f,key)=>(d,e)=>seq(d,e,(q,i,done)=>{GM(`<div class=note>Question ${i+1} of ${d.length}</div>${f(q)}<input id=ans autocomplete=off placeholder="Type your answer"><button class=btn id=ck>Check</button><div id=fb></div>`);$('#ck').onclick=()=>{const u=$('#ans').value.trim();$('#ck').disabled=1;done(u,norm(u)==norm(q[key]),'Answer: '+q[key])}});
const ENG={quiz:quizG({think:1}),img:quizG({}),speed:quizG({t:10}),adv:quizG({path:1}),
tf:(d,e)=>seq(d,e,(q,i,done)=>{GM(`<div class=note>Statement ${i+1} of ${d.length}</div><div class=card><b>${q.s}</b></div><div class=two><button class="btn g">✔ True</button><button class="btn r">✘ False</button></div><div id=fb></div>`);document.querySelectorAll('.two .btn').forEach((b,k)=>b.onclick=()=>{document.querySelectorAll('.two .btn').forEach(x=>x.disabled=1);done(k==0,(k==0)==q.a,q.e)})}),
scr:typed(q=>{let s=q.w;for(let n=0;n<20&&s==q.w;n++)s=shuf(q.w.split('')).join('');return `<div class=card style="text-align:center"><div class=note>Hint: ${q.h}</div><h1 style="letter-spacing:6px">${s}</h1></div>`},'w'),
fill:typed(q=>`<div class=card><b>${q.s.replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</b></div>`,'a'),
sort:(d,e)=>{const it=shuf(d.items.map((x,k)=>({k,n:x[0],c:x[1]})));seq(it,e,(q,i,done)=>{GM(`<div class=card style="text-align:center"><h2>${q.n}</h2><p class=note>Which group does it belong to?</p></div><div class=two>${d.cats.map(k=>`<button class="btn p" data-k="${k}">${k}</button>`).join('')}</div><div id=fb></div>`);document.querySelectorAll('.two .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.two .btn').forEach(x=>x.disabled=1);done(b.dataset.k,b.dataset.k==q.c,'It is a '+q.c+'.')})})},
match:(d,e)=>{let a=null,mis=0,dn=[];const L=shuf(d.map((p,i)=>[p[0],i])),Rr=shuf(d.map((p,i)=>[p[1],i]));const st=()=>{GM(`<p class=note>Tap a term, then its meaning.</p><div class=two><div>`+L.map(x=>`<button class="opt ${dn.includes(x[1])?'ok':''} ${a===x[1]?'sel':''}" data-s=l data-i=${x[1]}>${x[0]}</button>`).join('')+`</div><div>`+Rr.map(x=>`<button class="opt ${dn.includes(x[1])?'ok':''}" data-s=r data-i=${x[1]}>${x[0]}</button>`).join('')+`</div></div>`);document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(dn.includes(i))return;if(b.dataset.s=='l'){a=i;return st()}if(a==null)return;if(a==i){dn.push(i);snd(1);a=null;if(dn.length==d.length)return e(Math.max(0,d.length-mis),d.length,{mistakes:mis})}else{mis++;snd(0);a=null}st()})};st()},
mem:(d,e)=>{const cs=shuf(d.flatMap((p,i)=>[[p[0],i],[p[1],i]]));let op=[],dn=[],mv=0;const st=()=>{GM(`<p class=note>Find the matching pairs. Moves: ${mv}</p><div class=grid>`+cs.map((x,k)=>`<button class="opt mem ${dn.includes(x[1])?'ok':''}" data-k=${k}>${dn.includes(x[1])||op.includes(k)?x[0]:'❓'}</button>`).join('')+'</div>');document.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(op.length>1||op.includes(k)||dn.includes(cs[k][1]))return;op.push(k);if(op.length==2){mv++;if(cs[op[0]][1]==cs[k][1]){dn.push(cs[k][1]);op=[];snd(1);st();if(dn.length==d.length)setTimeout(()=>{const m=Math.max(0,mv-d.length-2);e(Math.max(0,d.length-m),d.length,{mistakes:m})},500);return}st();snd(0);setTimeout(()=>{op=[];st()},800)}else st()})};st()}};
/* ===== playing a level and saving the attempt ===== */
let CUR=null,T0=0;
function start(id){CUR=CT.levels.find(l=>l.levelId==id);T0=Date.now();R(bar()+`<button class="btn s" onclick="subject('${CUR.subjectId}')">← Quit</button><h3>${CUR.game}: ${CUR.topic}</h3><div id=gm></div>`);ENG[CUR.gameType](cp(CUR.data),finish)}
async function finish(c,t,A){const l=CUR,pc=t?Math.round(c/t*100):0,ok=pc>=Number(l.passMark),L=lvs(l.subjectId),nx=L[L.findIndex(x=>x.levelId==l.levelId)+1],first=ok&&DN[l.levelId]==null;

function revStart(){const it=revPick();if(!it.length)return alert('Finish a level first. Revision uses topics you have completed.');
 R(bar()+`<button class="btn s" onclick="revZone()">← Back</button><h3>🧠 Revision</h3><div id=gm></div>`);
 seq(it,(c,t)=>{kvSet('box',BX);snd(1);GM(`<div class=card style="text-align:center"><div class="big pop">🌟</div><h2>Revision done!</h2><p>You remembered <b>${c}</b> of ${t}.</p><button class="btn g" onclick="revStart()">Revise more</button><button class=btn onclick="revZone()">Back</button></div>`)},(q,i,done)=>{
  GM(`<div class=note>Recall ${i+1} of ${it.length} · ${q.tp}</div><div class=card><b>${q.q.replace('___','_____')}</b></div><input id=ans autocomplete=off placeholder="Type from memory. No options!"><button class=btn id=ck>Check</button><div id=fb></div>`);
  $('#ck').onclick=()=>{const u=$('#ans').value.trim(),ok=near(u,q.a),b=BX[q.k]?BX[q.k].b:0,nb=ok?Math.min(b+1,4):0;$('#ck').disabled=1;BX[q.k]={b:nb,due:Date.now()+(DAYS[CT.rev&&CT.rev.freq]||DAYS['Every 3 days'])[nb]*864e5};kvSet('box',BX);done(u,ok,'Answer: '+q.a+(q.e?'. '+q.e:''))}})}
function revCard(){const r=SD.rev||{on:true,freq:'Every 3 days'};return `<div class="card noprint"><b>Revision settings</b><label><input type=checkbox id=rvo style="width:auto" ${r.on?'checked':''}> Turn on revision questions</label><select id=rvf>${['Daily','Every 3 days','Weekly'].map(f=>`<option ${r.freq==f?'selected':''}>${f}</option>`).join('')}</select><button class="btn g" onclick="run(async()=>{await api('saveRevision',{on:$('#rvo').checked,freq:$('#rvf').value});alert('Saved')})">Save revision settings</button><p class=note>Students revise the topics they have completed, mixed together.</p></div>`}
boot();
</script></body></html>
